<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoiceTodo · 分类列表原型</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --sep:rgba(60,60,67,.12);
    --text:#1c1c1e; --sub:#8e8e93; --accent:#0a84ff; --green:#30d158; --red:#ff3b30;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:100px;}
  .navbar{position:sticky; top:0; z-index:20; background:rgba(242,242,247,.9); backdrop-filter:blur(14px);}
  .navrow{display:flex; align-items:center; justify-content:space-between; padding:8px 16px;}
  .ntitle{font-size:17px; font-weight:700;}
  .iconbtn{font-size:15px; background:none; border:none; color:var(--accent); padding:6px 4px; cursor:pointer;}
  .mini{display:flex; gap:6px; align-items:center;}
  .seg{display:flex; background:#e9e9eb; border-radius:9px; padding:2px; margin:4px 16px 8px;}
  .seg button{flex:1; border:none; background:transparent; padding:6px 0; border-radius:7px;
    font-size:13px; color:#666; cursor:pointer; font-family:inherit;}
  .seg button.active{background:#fff; color:#000; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.15);}
  main{max-width:620px; margin:0 auto; padding:0 12px;}
  .card{background:var(--card); border-radius:12px; margin:10px 0; overflow:hidden;}
  .sec-head{display:flex; align-items:center; gap:8px; padding:12px 16px 6px; font-size:15px; font-weight:650;}
  .sec-head .dot{width:10px; height:10px; border-radius:3px; flex:0 0 auto;}
  .sec-head .count{margin-left:auto; font-size:12px; color:var(--sub); font-weight:400;}
  .sec-head .indent{width:0; height:1px; flex:0 0 auto;}
  .item{display:flex; align-items:flex-start; gap:10px; padding:11px 16px; transition:background .15s;}
  .item+.item{border-top:1px solid var(--sep);}
  .item.hl{background:#eef6ff;}
  .circle{width:26px; height:26px; flex:0 0 26px; border-radius:50%; border:1.5px solid var(--sub);
    display:flex; align-items:center; justify-content:center; margin-top:2px; cursor:pointer;}
  .circle.done{background:var(--green); border-color:var(--green);}
  .item.done .txt{color:var(--sub); text-decoration:line-through;}
  .col{flex:1; min-width:0;}
  .txt{font-size:16px; line-height:1.35; word-break:break-word;}
  .meta{display:flex; gap:8px; font-size:12px; color:var(--sub); margin-top:3px; flex-wrap:wrap;}
  .bell{color:var(--accent);}
  .chip{font-size:11px; color:var(--accent); background:rgba(10,132,255,.1); padding:1px 6px; border-radius:6px; font-weight:600;}
  .more{color:var(--sub); cursor:pointer; padding:4px;}
  .del{color:var(--red); cursor:pointer; padding:4px; display:none;}
  body.editing .del{display:block;}
  .chev{color:var(--sub); font-size:12px; font-weight:700; width:14px; flex:0 0 14px; text-align:center;}
  .minus{color:var(--red); font-size:20px; cursor:pointer; margin-right:2px; flex:0 0 auto; line-height:1;}
  .empty{padding:30px 16px; text-align:center; color:var(--sub); font-size:14px;}
  .fabwrap{position:fixed; right:18px; bottom:24px; display:flex; flex-direction:column; gap:12px; z-index:15;}
  .fab{width:56px; height:56px; border-radius:28px; border:none; color:#fff; font-size:26px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.25); cursor:pointer; background:var(--accent);}
  .fab.red{background:var(--red); margin-top:-6px;}
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:30; display:flex;
    align-items:flex-end; justify-content:center;}
  .sheet{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:620px;
    max-height:82vh; overflow:auto; padding:12px 16px 26px; animation:up .2s;}
  @keyframes up{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
  .sheet h3{margin:6px 0 12px; font-size:17px; font-weight:700;}
  .sheetrow{display:flex; align-items:center; gap:12px; padding:12px 8px; border-bottom:1px solid var(--sep);}
  .ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;}
  .nm{flex:1; font-size:16px;}
  .grip{color:#c7c7cc; font-size:18px; cursor:grab;}
  .tag{font-size:11px; color:var(--accent); font-weight:600;}
  .sheetrow button{margin-left:6px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin:0 0 6px 2px;}
  input[type=text]{width:100%; padding:11px 12px; font-size:16px; border:1px solid #d1d1d6;
    border-radius:10px; font-family:inherit; background:#fff;}
  select{width:100%; padding:11px 12px; font-size:16px; border:1px solid #d1d1d6; border-radius:10px; font-family:inherit; background:#fff;}
  .swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{width:34px;height:34px;border-radius:50%; cursor:pointer; display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;border:2px solid transparent;}
  .swatch.sel{border-color:#000;}
  .icons{display:flex; gap:10px; flex-wrap:wrap;}
  .ic{width:40px;height:40px;border-radius:9px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;border:2px solid transparent;}
  .ic.sel{border-color:var(--accent);}
  .btnrow{display:flex; gap:10px; margin-top:16px;}
  .btn{padding:12px; border:none; border-radius:11px; font-size:15px; cursor:pointer; font-family:inherit;}
  .btn.primary{background:var(--accent); color:#fff; flex:1;}
  .btn.danger{color:var(--red); background:#ffeeef; display:none;}
  body.editman .btn.danger{display:block;}
  .toast{position:fixed; left:50%; bottom:112px; transform:translateX(-50%);
    background:rgba(0,0,0,.85); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:14px; z-index:50; opacity:0; transition:.25s; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1;}
  .swatch-row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .sub-btn{display:block; width:100%; text-align:left; padding:10px 8px; font-size:15px;
    color:var(--accent); background:none; border:none; cursor:pointer; border-bottom:1px solid var(--sep); font-family:inherit;}
</style>
</head>
<body>
  <div class="navbar">
    <div class="navrow">
      <button class="iconbtn" onclick="openManage()">📁 管理</button>
      <span class="ntitle">待办</span>
      <div class="mini">
        <button class="iconbtn" id="filterBtn" style="color:var(--sub)" onclick="openFilter()">⛃</button>
        <button class="iconbtn" id="tagBtn" style="color:var(--sub)" onclick="openTagFilter()">#</button>
        <button class="iconbtn" onclick="toggleEdit()">✎</button>
      </div>
    </div>
    <div class="seg">
      <button data-mode="grouped" onclick="setMode('grouped')">分组</button>
      <button data-mode="flat" onclick="setMode('flat')">全部</button>
    </div>
  </div>

  <main id="content"></main>

  <div class="fabwrap">
    <button class="fab" title="文字新增" onclick="addItem('text')">＋</button>
    <button class="fab red" title="语音新增" onclick="addItem('voice')">🎤</button>
  </div>

  <div id="modal"></div>
  <div id="toast" class="toast"></div>

<script>
// ================= 数据 =================
const STORE="vt_proto_lists_v2";
const pal=["#E53935","#FB8C00","#FDD835","#43A047","#039BE5","#5E35B1","#8E24AA","#6D4C41"];
const icons={"tray.fill":"📥","checklist":"☑️","book":"📚","briefcase":"💼","cart":"🛒","house":"🏠","bolt":"⚡","calendar":"📅","star":"⭐"};
let mode='grouped', editing=false, filterListID=null, filterTag=null, manageEdit=false, movePending=null;
let collapsedLists=new Set();

function seed(){
  let s=localStorage.getItem(STORE);
  if(s)return JSON.parse(s);
  const d={lists:[],items:[],tags:['重要','紧急','稍后']};
  d.lists=[
    {id:'inbox',name:'收件箱',color:'#039BE5',icon:'tray.fill',pos:0,def:true,parent:null},
    {id:'study',name:'学习',color:'#5E35B1',icon:'book',pos:1,def:false,parent:null},
    {id:'std-math',name:'数学',color:'#8E24AA',icon:'checklist',pos:0,def:false,parent:'study'},
    {id:'std-eng',name:'英语',color:'#8E24AA',icon:'checklist',pos:1,def:false,parent:'study'},
    {id:'life',name:'生活',color:'#43A047',icon:'house',pos:2,def:false,parent:null},
    {id:'long',name:'长期计划',color:'#FB8C00',icon:'star',pos:3,def:false,parent:null},
  ];
  const now=Date.now();
  const I=(t,list,tags,ts=now,done=false,bell=null)=>({id:uuid(),text:t,list,tags,bell,ts,done});
  d.items=[
    I('复习英语单词','std-eng',['重要'],now+0),
    I('看完微积分第三章','std-math',['稍后'],now-1e5),
    I('去拿快递','life',['紧急'],now-2e5),
    I('读完一本书','long',['稍后'],now-3e5,false),
    I('采购日用品','life',[],now-4e5,true),
  ];
  localStorage.setItem(STORE,JSON.stringify(d));
  return d;
}
let db=seed();
function save(){localStorage.setItem(STORE,JSON.stringify(db));}
function uuid(){return 'x'+Math.random().toString(36).slice(2,10);}

// ================= 树结构 =================
// 返回 [[list, depth], ...]，按父级排序后的展平树，任意层级。
function treeLists(){
  const out=[];
  const sortedChildren=id=>db.lists.filter(l=>l.parent===id).sort((a,b)=>a.pos-b.pos);
  (function walk(id,depth){ // id=null 表示顶层
    sortedChildren(id).forEach(l=>{ out.push([l,depth]); walk(l.id,depth+1); });
  })(null);
  return out;
}
const listsSorted=()=>db.lists.slice().sort((a,b)=>a.pos-b.pos);
const itemSort=(a,b)=>(a.done-b.done)||(b.ts-a.ts);
const dimMap=()=>{const m={};db.lists.forEach(l=>m[l.id]=l);return m;};
const defList=()=>db.lists.find(l=>l.def)||db.lists[0];
const indentHTML=d=>d>0?`<span class="indent" style="width:${d*16}px"></span>`:'';

// ================= 渲染主列表 =================
function render(){
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  document.body.classList.toggle('editing',editing);
  document.getElementById('filterBtn').style.color=filterListID?'var(--accent)':'var(--sub)';
  document.getElementById('tagBtn').style.color=filterTag?'var(--accent)':'var(--sub)';
  const c=document.getElementById('content');
  let html='';

  if(mode==='grouped'){
    const groups=treeLists().map(([l,d])=>({l,d,items:db.items.filter(i=>i.list===l.id)}));
    let built=groups.map(g=>{
      if(!g.items.length && !collapsedLists.has(g.l.id))return '';
      const chev=collapsedLists.has(g.l.id)?'›':'⌄';
      const head=`<div class="sec-head" data-sech="${g.l.id}" onclick="toggleCollapse('${g.l.id}')" oncontextmenu="openForm(db_lists('${g.l.id}'));return false">
        <span class="chev">${chev}</span><span class="dot" style="background:${g.l.color}"></span>${indentHTML(g.d)}&nbsp;${icons[g.l.icon]||'☑️'}&nbsp;${esc(g.l.name)}<span class="count">${g.items.length}</span></div>`;
      const items=collapsedLists.has(g.l.id)?'':g.items.map(i=>itemHTML(i,g.d)).join('');
      return `<div class="card" data-secid="${g.l.id}">${head}${items}</div>`;
    }).join('');
    if(!built)html=card(empty('还没有待办<br>点右下角按钮，语音或文字输入创建待办'));
    else html=built;
  }else{
    let arr=db.items.slice();
    const dim=dimMap();
    if(filterListID)arr=arr.filter(i=>i.list===filterListID);
    if(filterTag)arr=arr.filter(i=>i.tags&&i.tags.includes(filterTag));
    arr.sort(itemSort);
    const name=filterTag?('#'+filterTag):(filterListID?(dim[filterListID]?dim[filterListID].name:'筛选'):'全部');
    const color=filterTag?'#0a84ff':(filterListID?(dim[filterListID]?dim[filterListID].color:'#8e8e93'):'#8e8e93');
    const head=`<div class="sec-head"><span class="dot" style="background:${color}"></span>&nbsp;${icons[dim[filterListID]&&dim[filterListID].icon]||'☑️'}&nbsp;${esc(name)}<span class="count">${arr.length}</span></div>`;
    html=`<div class="card" data-secid="__flat__">${head}${arr.map(i=>itemHTML(i,0)).join('')}</div>`;
    if(!arr.length)html=card(empty('暂无待办'));
  }
  c.innerHTML=html;
}

const empty=t=>`<div class="empty">${t}</div>`;
const card=h=>`<div class="card">${h}</div>`;

function itemHTML(i,d=0){
  const bell=i.bell?`<span class="bell">🔔 ${i.bell}</span>`:'';
  const chips=(i.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('');
  const imgChip=i.imgs&&i.imgs.length?`<span class="chip">🖼 ${i.imgs.length}</span>`:'';
  const linkChip=i.links&&i.links.length?`<span class="chip">🔗 ${i.links.length}</span>`:'';
  const when=new Date(i.ts).toLocaleString('zh-Hans',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const indent=d>0?`style="padding-left:${d*16}px"`:'';
  const minus=editing?`<span class="minus" onclick="event.stopPropagation();deleteItem('${i.id}')" title="删除">⊖</span>`:'';
  const grip=editing?`<span class="grip" title="长按拖动排序/换列表">≡</span>`:'';
  const dragAttr=editing?'draggable="true"':'';
  return `
  <div class="item ${i.done?'done':''}"
       data-id="${i.id}"
       ${dragAttr}
       ondragstart="dragStart(event,'${i.id}')"
       ondragend="dragEnd(event)"
       ${indent}>
    ${minus}
    <div class="circle ${i.done?'done':''}" onclick="toggleItem('${i.id}')">${i.done?'✓':''}</div>
    <span class="col">
      <span class="txt">${esc(i.text)}</span>
      <span class="meta">${when}${i.list?'':' · 未分类'}${bell}${chips}${imgChip}${linkChip}</span>
    </span>
    ${grip}
    <span class="more" onclick="moreMenu('${i.id}')">⋯</span>
    <button class="del" onclick="deleteItem('${i.id}')">✕</button>
  </div>`;
}

function db_lists(id){ return db.lists.find(x=>x.id===id); }

function toggleCollapse(id){
  if(collapsedLists.has(id)) collapsedLists.delete(id); else collapsedLists.add(id);
  render();
}

// 拖动到小节标题区域切换列表
function dragStart(e,id){e.dataTransfer.setData('text/plain',id);}
function dragEnd(){ e_clearHL(); }
function e_clearHL(){document.querySelectorAll('.sec-head').forEach(h=>h.style.background='');}
document.addEventListener('dragenter',e=>{
  const h=e.target.closest && e.target.closest('.sec-head');
  e_clearHL(); if(h)h.style.background='#eef6ff';
});
document.addEventListener('drop',e=>{
  e.preventDefault(); e_clearHL();
  const id=e.dataTransfer.getData('text/plain'); if(!id)return;
  const card=(e.target.closest && e.target.closest('[data-secid]')) || null;
  if(card && card.getAttribute('data-secid')!=='__flat__') moveItem(id, card.getAttribute('data-secid'), true);
});
document.addEventListener('dragover',e=>{ if(e.target.closest && e.target.closest('.card')) e.preventDefault(); });

// ================= 操作 =================
function toggleItem(id){
  const i=db.items.find(x=>x.id===id); if(!i)return; i.done=!i.done; save(); render();
}
function deleteItem(id){
  db.items=db.items.filter(x=>x.id!==id); save(); render(); toast('已删除');
}
function moveItem(id,listId,silent){
  const i=db.items.find(x=>x.id===id); if(!i)return;
  const dim=dimMap(); const L=dim[listId]; if(!i||!L)return;
  if(i.list===listId)return;
  i.list=listId; save(); render();
  if(!silent)toast('已移动到「'+L.name+'」');
}
function setMode(m){mode=m;render();}
function openFilter(){
  const dim=dimMap();
  const rows=treeLists().map(([l,d])=>
    listRow({name:'··'.repeat(d)+l.name,color:l.color,icon:l.icon},filterListID===l.id?'sel':'',()=>{filterListID=l.id;close();render();})
  ).join('');
  modal(`<h3 style="text-align:center">筛选列表</h3>
    ${listRow({name:'全部列表',color:'#8e8e93',icon:'checklist'},filterListID===null?'sel':'',()=>{filterListID=null;render();close();})}
    ${rows}`);
}
function openTagFilter(){
  const tags=(db.tags||[]).map(t=>
    listRow({name:'#'+t,color:'#0a84ff',icon:'checklist'},filterTag===t?'sel':'',()=>{filterTag=t;render();close();})
  ).join('');
  modal(`<h3 style="text-align:center">筛选标签</h3>
    ${listRow({name:'全部标签',color:'#8e8e93',icon:'checklist'},filterTag===null?'sel':'',()=>{filterTag=null;render();close();})}
    ${tags}${(db.tags||[]).length?`<div class="sub-btn" onclick="manageTags()">＋ 管理标签</div>`:''}`);
}
function toggleEdit(){editing=!editing;render();}

function addItem(kind){
  if(kind==='voice'){
    pushItem('（语音待办：刚才说的一段话）');
    toast('（原型演示）语音转写从简');
    return;
  }
  const txt=prompt('新的待办内容：');
  if(txt==null || !txt.trim()) return;
  pushItem(txt.trim());
}
function pushItem(text){
  const d=defList();
  db.items.push({id:uuid(),text,list:d.id,tags:[],links:[],imgs:[],bell:null,ts:Date.now(),done:false});
  save(); render(); toast('已加入「'+d.name+'」');
}

function moveMenu(id){
  movePending=id;
  const rows=treeLists().map(([l,d])=>{
    const cur=(db.items.find(x=>x.id===id)||{}).list===l.id;
    return listRow({name:'··'.repeat(d)+l.name,color:l.color,icon:l.icon},cur?'sel':'',()=>moveItem(id,l.id,false),cur?'✓':'');
  }).join('');
  modal(`<h3 style="text-align:center">移动到列表</h3>${rows}`);
}

// ⋯ 操作菜单：详情 / 删除（移动请用编辑模式拖动手柄）
function moreMenu(id){
  modal(`<h3 style="text-align:center">操作</h3>
    <div class="sheetrow" style="cursor:pointer" onclick="openDetail('${id}')">
      <span class="ico" style="background:#5E35B1">📝</span><span class="nm">详情（标签 / 图片 / 链接）</span></div>
    <div class="sheetrow" style="cursor:pointer" onclick="deleteItem('${id}');close()">
      <span class="ico" style="background:#ff3b30">🗑</span><span class="nm">删除待办</span></div>
    <div style="font-size:12px;color:var(--sub);padding:8px">排序 / 换列表：点右上 ✎ 进入编辑模式，按住 ≡ 拖动</div>`);
}

// 详情弹层：编辑内容、勾选标签、添加图片（本地读取）与链接
function openDetail(id){
  const it=db.items.find(x=>x.id===id); if(!it)return;
  it.tags=it.tags||[]; it.links=it.links||[]; it.imgs=it.imgs||[];
  const tagRows=(db.tags||[]).map(t=>{
    const on=it.tags.includes(t);
    return `<div class="sheetrow" style="cursor:pointer" onclick="toggleItemTag('${id}','${esc(t)}')">
      <span class="ico" style="background:#0a84ff">#</span><span class="nm">${esc(t)}</span><span>${on?'✓':''}</span></div>`;
  }).join('');
  const linkRows=it.links.map((l,idx)=>`
    <div class="sheetrow">
      <span class="ico" style="background:#5E35B1">🔗</span>
      <span class="nm" style="font-size:14px;word-break:break-all">
        <a href="${esc(l)}" target="_blank" style="color:var(--accent);text-decoration:none">${esc(l)}</a></span>
      <button class="iconbtn" style="color:var(--red)" onclick="delLink('${id}',${idx})">✕</button>
    </div>`).join('');
  const imgThumbs=it.imgs.map((d,idx)=>`
    <div style="position:relative;width:88px;height:88px;margin:4px">
      <img src="${d}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;cursor:zoom-in" onclick="viewImg('${id}',${idx})">
      <button class="iconbtn" style="position:absolute;top:-6px;right:-6px;background:#fff;border-radius:50%;color:var(--red);box-shadow:0 1px 4px rgba(0,0,0,.3);padding:2px 6px" onclick="event.stopPropagation();delImg('${id}',${idx})">✕</button>
    </div>`).join('');
  modal(`<h3>待办详情</h3>
    <div class="field"><label>内容</label><input type="text" id="dtext" value="${esc(it.text)}"></div>
    <div class="field"><label>标签（点击勾选）</label>
      ${tagRows||'<div class="empty">还没有标签</div>'}
      <div class="sheetrow" style="border-bottom:none;padding:6px 0 0">
        <span class="nm"><input type="text" id="dntag" placeholder="新标签" style="padding:8px 10px"></span>
        <button class="iconbtn" onclick="addTagFromDetail('${id}')">＋ 添加</button>
      </div></div>
    <div class="field"><label>图片</label>
      <div style="display:flex;flex-wrap:wrap">${imgThumbs}</div>
      <label class="btn" style="display:block;text-align:center;background:#f2f2f7;color:var(--accent)">📷 选择图片
        <input type="file" accept="image/*" multiple style="display:none" onchange="addImgs('${id}',this)"></label></div>
    <div class="field"><label>链接</label>
      ${linkRows}
      <div class="sheetrow" style="border-bottom:none;padding:6px 0 0">
        <span class="nm"><input type="text" id="dlink" placeholder="https://…" style="padding:8px 10px"></span>
        <button class="iconbtn" onclick="addLinkFromDetail('${id}')">＋ 添加</button>
      </div></div>
    <div class="btnrow"><button class="btn primary" onclick="saveDetail('${id}')">保存</button></div>`);
}
function toggleItemTag(id,t){
  const it=db.items.find(x=>x.id===id); if(!it)return;
  it.tags=it.tags||[];
  const i=it.tags.indexOf(t); i>=0?it.tags.splice(i,1):it.tags.push(t);
  save(); openDetail(id); render();
}
function addTagFromDetail(id){
  const v=(document.getElementById('dntag').value||'').trim(); if(!v)return;
  db.tags=db.tags||[]; if(!db.tags.includes(v))db.tags.push(v);
  const it=db.items.find(x=>x.id===id); it.tags=it.tags||[];
  if(!it.tags.includes(v))it.tags.push(v);
  save(); openDetail(id); render();
}
function addLinkFromDetail(id){
  let v=(document.getElementById('dlink').value||'').trim(); if(!v)return;
  if(!/^https?:\/\//.test(v))v='https://'+v;
  const it=db.items.find(x=>x.id===id); it.links=it.links||[];
  it.links.push(v); save(); openDetail(id); render();
}
function delLink(id,idx){const it=db.items.find(x=>x.id===id); it.links.splice(idx,1); save(); openDetail(id); render();}
function delImg(id,idx){const it=db.items.find(x=>x.id===id); it.imgs.splice(idx,1); save(); openDetail(id); render();}
function addImgs(id,input){
  const it=db.items.find(x=>x.id===id); it.imgs=it.imgs||[];
  [...input.files].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{ it.imgs.push(r.result); save(); openDetail(id); render(); };
    r.readAsDataURL(f);
  });
}
function saveDetail(id){
  const it=db.items.find(x=>x.id===id);
  const t=(document.getElementById('dtext').value||'').trim();
  if(t)it.text=t;
  save(); close(); render(); toast('已保存');
}

// 图片全屏查看：黑底、点任意处关闭（对应 App 的 fullScreenCover）
// 查看时暂存详情弹层内容，关闭后恢复。
let viewerBackup=null;
function viewImg(id,idx){
  const it=db.items.find(x=>x.id===id); if(!it||!it.imgs[idx])return;
  const m=document.getElementById('modal');
  viewerBackup=m.innerHTML;
  m.innerHTML=`<div style="position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center" onclick="closeViewer()">
    <img src="${it.imgs[idx]}" style="max-width:100%;max-height:100%;object-fit:contain" onclick="event.stopPropagation()">
    <button style="position:absolute;top:24px;right:24px;background:none;border:none;color:#fff;opacity:.85;font-size:28px;cursor:pointer" onclick="closeViewer()">✕</button>
  </div>`;
}
function closeViewer(){
  const m=document.getElementById('modal');
  m.innerHTML='';
  if(viewerBackup){ m.innerHTML=viewerBackup; viewerBackup=null; }
}

// ================= 列表管理 =================
function openManage(){
  manageEdit=false; document.body.classList.remove('editman');
  modalRows();
}
function modalRows(){
  const rows=treeLists().map(([l,d])=>`
    <div class="sheetrow" data-lid="${l.id}">
      <span class="ico" style="background:${l.color}">${icons[l.icon]||'☑️'}</span>
      <span class="nm" style="padding-left:${d*16}px">${esc(l.name)}${l.def?' <span class="tag">默认</span>':''}</span>
      <button class="iconbtn" style="color:var(--accent)" onclick="editList('${l.id}')">编辑</button>
      ${l.def?'':`<button class="iconbtn" style="color:var(--sub)" onclick="mkDef('${l.id}')">设默</button>`}
      <button class="iconbtn" style="color:var(--red)" onclick="delList('${l.id}')">删</button>
    </div>`).join('');
  modal(`<div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">管理列表</h3>
      <button class="btn" style="color:var(--accent);background:none;padding:6px" onclick="openNew()">＋ 新建</button>
    </div>
    ${rows||`<div class="empty">还没有列表</div>`}
    <div class="sub-btn" onclick="manageTags()"># 管理标签</div>
    <div class="btnrow"><button class="btn primary" onclick="close()">完成</button></div>
    <div style="font-size:12px;color:var(--sub);margin-top:10px">编辑列表时选择父列表即可建立嵌套（二级/三级）· 删除列表会把其子树与待办移回默认列表</div>`);
}

function mkDef(id){db.lists.forEach(l=>l.def=(l.id===id));save();modalRows();toast('新的默认列表已设置');}
function topCount(parentId){ return db.lists.filter(l=>l.parent===parentId).length; }
function delList(id){
  const l=db.lists.find(x=>x.id===id); if(!l)return;
  if(l.def)return toast('默认列表不可删除');
  if(!confirm('删除「'+l.name+'」？其子列表与该列表内待办将移回默认列表。'))return;
  const d=defList();
  function collect(pid){ let ids=[pid]; db.lists.forEach(x=>{ if(x.parent===pid) ids=ids.concat(collect(x.id)); }); return ids; }
  const ids=collect(id);
  db.items.forEach(i=>{ if(ids.includes(i.list)) i.list=d.id; });
  db.lists=db.lists.filter(x=>!ids.includes(x.id)); save(); modalRows(); toast('已删除');
}
function editList(id){ openForm(db.lists.find(x=>x.id===id)); }
function openNew(){ openForm(null); }
function openNewChild(id){
  const parent=(db.lists.find(x=>x.id===id))||null;
  openForm(null,parent);
}

// parent 选择候选：树中除自身及其子孙外的所有列表
function parentOptions(list){
  const excl=new Set();
  if(list){
    excl.add(list.id);
    function cc(pid){db.lists.forEach(l=>{ if(l.parent===pid){ excl.add(l.id); cc(l.id); } });}
    cc(list.id);
  }
  return treeLists().filter(([l])=>!excl.has(l.id));
}

function openForm(list,presetParent){
  const isNew=!list;
  const c=(list&&list.color)||pal[0], ic=(list&&list.icon)||'checklist', nm=(list&&list.name)||'';
  const curParent=(list&&list.parent)||(presetParent&&presetParent.id)||null;
  const popts=parentOptions(list);
  const parentSel=`<option value="">（无 — 顶层列表）</option>`+
    popts.map(([l,d])=>`<option value="${l.id}" ${l.id===curParent?'selected':''}>${'　'.repeat(d)}${esc(l.name)}</option>`).join('');
  modal(`
    <h3>${isNew?'新建列表':'编辑列表'}</h3>
    <div class="field"><label>名称</label><input type="text" id="fn" value="${esc(nm)}" placeholder="如：学习 / 生活杂事 / 长期计划"></div>
    <div class="field"><label>父列表（建立二级/三级分类）</label>
      <select id="fparent">${parentSel}</select></div>
    <div class="field"><label>颜色</label>
      <div class="swatches" id="fcolor">${pal.map(h=>`<span class="swatch ${h===c?'sel':''}" data-h="${h}" style="background:${h}">${h===c?'✓':''}</span>`).join('')}</div>
    </div>
    <div class="field"><label>图标</label>
      <div class="icons" id="ficon">${Object.entries(icons).map(([k,v])=>`<span class="ic ${k===ic?'sel':''}" data-i="${k}">${v}</span>`).join('')}</div>
    </div>
    <div class="btnrow">
      <button class="btn primary" onclick="saveForm(${isNew?'null':`'${list.id}'`})">保存</button>
      <button class="btn danger" style="display:${isNew?'none':'block'}" onclick="delListFromForm('${list.id}')">删除列表</button>
    </div>`);
  selState('fcolor','data-h'); selState('ficon','data-i');
}
function selState(containerId, attr){
  document.getElementById(containerId).addEventListener('click',e=>{
    const el=e.target.closest('[data-h],[data-i]'); if(!el)return;
    el.parentElement.querySelectorAll(`[${attr}]`).forEach(s=>s.classList.remove('sel'));
    el.classList.add('sel');
  });
}
function saveForm(id){
  const f=document.getElementById('fn');
  const name=(f.value||'').trim(); if(!name)return toast('请输入名称');
  const color=(document.querySelector('#fcolor .swatch.sel')||{}).dataset?document.querySelector('#fcolor .swatch.sel').dataset.h:pal[0];
  const iconEl=document.querySelector('#ficon .ic.sel');
  const icon=iconEl?iconEl.dataset.i:'checklist';
  const parentId=document.getElementById('fparent').value||null;
  if(id){
    const l=db.lists.find(x=>x.id===id); if(l){l.name=name;l.color=color;l.icon=icon;l.parent=parentId;}
  }else{
    const cnt=db.lists.filter(x=>x.parent===parentId).length;
    db.lists.push({id:uuid(),name,color,icon,pos:cnt,def:db.lists.length===0,parent:parentId});
  }
  save(); close(); openManage(); toast(id?'已保存':'已创建');
}
function delListFromForm(id){ close(); delList(id); }

// ================= 标签管理 =================
function manageTags(){
  db.tags=db.tags||[];
  const rows=db.tags.map(t=>`
    <div class="sheetrow">
      <span class="ico" style="background:#0a84ff">#</span>
      <span class="nm">${esc(t)}</span>
      <button class="iconbtn" style="color:var(--red)" onclick="delTag('${esc(t)}')">删除</button>
    </div>`).join('');
  modal(`<h3 style="text-align:center">管理标签</h3>
    <div class="sheetrow">
      <span class="ico" style="background:#0a84ff">#</span>
      <span class="nm"><input type="text" id="ntag" placeholder="新标签" style="padding:8px 10px"></span>
      <button class="iconbtn" style="color:var(--accent)" onclick="addTag()">添加</button>
    </div>
    ${rows||'<div class="empty">还没有标签</div>'}
    <div class="btnrow"><button class="btn primary" onclick="close()">完成</button></div>`);
}
function addTag(){
  const v=(document.getElementById('ntag').value||'').trim(); if(!v)return;
  db.tags=db.tags||[]; if(db.tags.includes(v))return toast('标签已存在');
  db.tags.push(v); save(); manageTags(); toast('已添加');
}
function delTag(t){
  db.tags=db.tags.filter(x=>x!==t);
  db.items.forEach(i=>{ i.tags=(i.tags||[]).filter(x=>x!==t); });
  if(filterTag===t)filterTag=null;
  save(); manageTags(); toast('已删除');
}

// ================= 通用 =================
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function listRow(l,cls,onclick,check=''){
  return `<div class="sheetrow" style="cursor:pointer" onclick="(${onclick.toString()})()">
    <span class="ico" style="background:${l.color}">${icons[l.icon]||'☑️'}</span>
    <span class="nm">${esc(l.name)}</span><span>${check}</span></div>`;
}
function modal(inner){
  document.getElementById('modal').innerHTML=`<div class="mask" onclick="if(event.target===event.currentTarget)close()"><div class="sheet" onclick="event.stopPropagation()">${inner}</div></div>`;
}
function close(){document.getElementById('modal').innerHTML='';}
let tTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(tTimer); tTimer=setTimeout(()=>t.classList.remove('show'),1600);
}

// ================= 初始化 =================
render();
</script>
</body>
</html>
