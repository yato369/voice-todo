name: VoiceTodo
options:
  bundleIdPrefix: com.voicetodo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
targets:
  VoiceTodoApp:
    type: application
    platform: iOS
    sources:
      - path: VoiceTodoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicetodo.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VoiceTodoApp/Info.plist
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
